[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-fence"
version = "0.3.0"
description = "A lightweight Windows cursor boundary lock utility for multi-monitor desktops"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["Pillow>=10,<12", "pystray>=0.19.5,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
